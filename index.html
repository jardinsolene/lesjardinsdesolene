<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Jardins de Solène – Nos liens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF6E9; --ink:#2A0A3F; --muted:#5E4A70; --panel:#FFFFFF;
  --crimson:#B5003F; --orange:#E85500; --green:#2E8F4E; --purple:#3B0A6B;
  --on:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B0B2B; --ink:#F6EEFA; --muted:#C9B6D6; --panel:#FFFFFF;
    --crimson:#C4124D; --orange:#E85500; --green:#2E8F4E; --purple:#5A2A93;
  }
}
:root[data-theme="dark"]{
  --bg:#1B0B2B; --ink:#F6EEFA; --muted:#C9B6D6; --panel:#FFFFFF;
  --crimson:#C4124D; --orange:#E85500; --green:#2E8F4E; --purple:#5A2A93;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; justify-content:center; padding:28px 18px 40px;
}
main{width:100%; max-width:460px; text-align:center}
.logo{
  background:var(--panel); border-radius:50% 50% 46% 46% / 42% 42% 58% 58%;
  width:min(78vw,300px); aspect-ratio:1; margin:0 auto 22px;
  display:grid; place-items:center; padding:10%;
}
.logo img{width:100%; height:auto; display:block}
h1{font-size:1.9rem; line-height:1.15; font-weight:800; margin:0 0 6px; letter-spacing:-.01em}
.sub{margin:0 0 26px; color:var(--muted); font-size:1.02rem}
ul{list-style:none; margin:0; padding:0; display:grid; gap:12px}
a.btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:62px; padding:10px 18px; border-radius:18px; text-decoration:none;
  color:var(--on); background:var(--c); font-weight:600; font-size:1.12rem;
  box-shadow:0 3px 0 rgba(0,0,0,.22);
  transition:transform .12s ease, box-shadow .12s ease;
}
a.btn small{font-weight:400; font-size:.8rem; opacity:.9}
a.btn:hover{transform:translateY(-2px); box-shadow:0 5px 0 rgba(0,0,0,.22)}
a.btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.22)}
a.btn:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
footer{margin-top:30px; color:var(--muted); font-size:.85rem}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
